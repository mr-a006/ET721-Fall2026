<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Item {{item_id}}</title>
    <link rel="stylesheet" href="{{url_for('static', filename = 'style.css')}}">
</head>
<body>
    <header>
        <h1 class="title">Aqeel Hussain</h1>
        <p>Item Management Application</p>

    <main>
        <section class="container confirmation">
            <h1>Item Deleted Successfully!</h1>
            <p><strong>ID:</strong> {{item_id}}</p>
            <p><strong>Deleted Value:</strong> {{deleted_item.name}}</p>
            <p><strong>Price:</strong> ${{deleted_item.price}}</p>
            <a href="{{url_for('home')}}" class="linkbutton">Back to Home</a>
        </section>
    </main>

    <footer>
        <p>Created by Aqeel Hussain</p>
    </footer>
</body>
</html>
