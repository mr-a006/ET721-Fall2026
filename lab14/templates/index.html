<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqeel Hussain - Create Item</title>
    <link rel="stylesheet" href="{{url_for('static', filename = 'style.css')}}">
</head>
<body>
    <header>
        <h1 class="title">Aqeel Hussain</h1>
        <p>Item Management Application</p>
    </header>

    <main>
        <section class="container">
            <h2>Create Item</h2>
            <form id="itemForm">
                <div class="formsession">
                    <label>Name:
                        <input type="text" id="name" required>
                    </label>
                </div>

                <div class="formsession">
                    <label>Price:
                        <input type="number" id="price" required>
                    </label>
                </div>

                <div class="formsession">
                    <button type="submit">SUBMIT</button>
                </div>

                <p id="response"></p>
            </form>
        </section>

        <!-- LOADING ITEM -->
        <section class="container loaditems">
            <h2>ALL ITEMS</h2>
            <button onclick="loaditems()">LOAD ITEMS</button>

            <ul class="itemslist">
                
            </ul>

        </section>
        
        <!-- TABLE TO UPDATE AN ITEM NAME AND PRICE -->
        <section id="updateSection" class="container" style="display: none;">
            <h3>Update Item</h3>
            <input type="hidden" id="updateID">
            <label>Name:
                <input type="text" id="updateName">
            </label>
            <label>Price:
                <input type="number" id="updatePrice">
            </label>

            <button onclick="updateItem()">SAVE UPDATE</button>
        </section>
    </main>

    <footer>
        <p>Created by Aqeel Hussain</p>
    </footer>

    <script src="{{url_for('static', filename='app_script.js')}}">HOLDER</script>
</body>
</html>
