<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Item - Aqeel Hussain</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <header>
        <h1 class="title">Aqeel Hussain</h1>
        <p>Item Management Application</p>
    </header>

    <main>
        <section class="container confirmation">
            <h2>Item Updated Successfully!</h2>

            <p><strong>Item ID:</strong> {{item_id}}</p>
            <p><strong>Name:</strong> {{item.name}}</p>
            <p><strong>Price:</strong> ${{item.price}}</p>

            <a href="/" class="linkbutton">RETURN TO HOMEPAGE</a>
        </section>
    </main>

    <footer>
        <p>Created by Aqeel Hussain</p>
    </footer>
</body>
</html>
